name: Deploy & Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and creating releases
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Package zip archive
        run: |
          cd dist
          zip -r ../wasm-c-ide.zip .
          cd ..

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-c-ide-zip
          path: wasm-c-ide.zip
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-c-ide-zip
          path: .

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          body: |
            ### WebAssembly C/C++ Teaching IDE — Latest Build

            Automated production build from commit `${{ github.sha }}` on `main`.

            #### Direct Download
            Download **`wasm-c-ide.zip`** below for direct offline use or custom hosting.
            Unzip the contents directly into your web server's root or any sub-path.
          files: wasm-c-ide.zip
          make_latest: "true"
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

